<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kontakty</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#7289da">
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <style>
        :root {
            --bg-color: #23272a; --header-color: #1e2124; --text-color: #fff;
            --accent-color: #7289da; --green: #43b581; --red: #dc3545; --grey: #99aab5;
        }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: var(--header-color); flex-shrink: 0; }
        header a, header button { color: var(--grey); text-decoration: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; padding: 5px; }
        #install-button { display: none; }
        #call-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
        #caller-info { height: 60px; }
        #caller-name { font-size: 2.2rem; font-weight: bold; }
        #call-status { font-size: 1rem; color: var(--grey); margin-top: 5px; }
        #call-buttons { display: flex; gap: 28px; align-items: center; margin-top: 40px; }
        #main-call-button { width: 100px; height: 100px; border-radius: 50%; border: none; font-size: 3rem; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        #decline-button { width: 72px; height: 72px; border-radius: 50%; border: none; font-size: 2rem; cursor: pointer; background-color: var(--red); display: none; justify-content: center; align-items: center; }
        .idle { background-color: var(--accent-color); }
        .calling-out, .in-call { background-color: var(--red); }
        .calling-in { background-color: var(--green); animation: ring-pulse 1s infinite; }
        @keyframes ring-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        footer { padding: 15px; background-color: var(--header-color); flex-shrink: 0; text-align: center; }
        #toggle-contacts-btn { font-size: 2rem; color: var(--accent-color); background: none; border: none; cursor: pointer; }
        #contacts-panel { position: fixed; bottom: 0; left: 0; right: 0; background-color: #2c2f33; border-top: 1px solid #444; max-height: 70%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s ease-in-out; z-index: 100; }
        #contacts-panel.visible { transform: translateY(0); }
        #contacts-header { padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #444; cursor: pointer; }
        #contacts-header:hover { color: var(--accent-color); }
        #contacts-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; }
        .contact-item { display: flex; align-items: center; padding: 15px; }
        .contact-name { flex-grow: 1; }
        .contact-status { color: var(--grey); font-size: 0.85rem; margin-right: 12px; }
        .contact-call-btn { font-size: 1.5rem; color: var(--green); background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <a id="forum-link" href="https://0-skar.github.io/3/" title="Przejdź do forum">⌂</a>
        <button id="install-button" title="Zainstaluj aplikację">📌</button>
        <button id="close-button" title="Zakończ / Idź do Forum">❌</button>
    </header>
    <main id="call-area">
        <div id="caller-info">
            <div id="caller-name">Gotowy</div>
            <div id="call-status">Wybierz kontakt, aby zadzwonić</div>
        </div>
        <div id="call-buttons">
            <button id="decline-button" title="Odrzuć połączenie">📵</button>
            <button id="main-call-button" class="idle">📞</button>
        </div>
    </main>
    <footer>
        <button id="toggle-contacts-btn" title="Ulubione Kontakty">⭐</button>
    </footer>
    <div id="contacts-panel">
        <div id="contacts-header">Ulubione Kontakty</div>
        <ul id="contacts-list"></ul>
    </div>
    <script>
        // CALL_V9 — aplikacja Kontakty: naprawione WebRTC i pełny cykl dzwonienia.
        const hfSpaceUrl = "eosforus-chat.hf.space"; const wsUrl = `wss://${hfSpaceUrl}/ws/`;
        const VAPID_PUBLIC_KEY = "BD8O0XhtyebRHHOUgMtsdkNl1j6C_ugAmEPGnXEiy-SuDK6JJIYgrdKXquvk3gmYuujmmft7WQMnTZlibryenyQ=";
        const forumBaseUrl = "https://0-skar.github.io/3/";
        let socket, myUsername, peerConnection, localStream, currentCallPartner; let callState = 'IDLE';
        let ringtone = null, pendingIce = [], outgoingTimer = null, currentCallMedia = 'audio', deferredPrompt = null;

        const ui = { installButton: document.getElementById('install-button'), forumLink: document.getElementById('forum-link'), closeButton: document.getElementById('close-button'), callerName: document.getElementById('caller-name'), callStatus: document.getElementById('call-status'), mainCallButton: document.getElementById('main-call-button'), declineButton: document.getElementById('decline-button'), toggleContactsBtn: document.getElementById('toggle-contacts-btn'), contactsPanel: document.getElementById('contacts-panel'), contactsHeader: document.getElementById('contacts-header'), contactsList: document.getElementById('contacts-list'), };

        document.addEventListener('DOMContentLoaded', initializeApp);

        function initializeApp() {
            setupEventListeners();
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(e => console.error('SW error', e)); }
            connectSocket();
        }

        function setupEventListeners() {
            window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; ui.installButton.style.display = 'block'; });
            ui.installButton.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; ui.installButton.style.display = 'none'; } });
            ui.closeButton.addEventListener('click', () => {
                if (callState === 'INCOMING_CALL') { declineCall(); return; }
                if (callState !== 'IDLE') { endCall(true); setState('IDLE', { status: "Gotowy do nowego połączenia" }); return; }
                window.location.href = ui.forumLink.href;
            });
            ui.toggleContactsBtn.addEventListener('click', () => ui.contactsPanel.classList.add('visible'));
            ui.contactsHeader.addEventListener('click', () => ui.contactsPanel.classList.remove('visible'));
            ui.mainCallButton.addEventListener('click', handleMainButtonClick);
            ui.declineButton.addEventListener('click', declineCall);
        }

        function startRing() { stopRing(); try { ringtone = new Audio('ringtone.mp3'); ringtone.loop = true; ringtone.play().catch(e => {}); } catch (e) {} if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]); }
        function stopRing() { if (ringtone) { try { ringtone.pause(); } catch (e) {} ringtone = null; } if (navigator.vibrate) navigator.vibrate(0); }

        function setState(newState, data = {}) {
            callState = newState;
            if (newState === 'IDLE') { currentCallPartner = data.name || null; }
            else if (data.name) { currentCallPartner = data.name; }
            if (currentCallPartner) { ui.forumLink.href = `${forumBaseUrl}?action=autologin&chat_with=${currentCallPartner}`; }
            else { ui.forumLink.href = `${forumBaseUrl}?action=autologin`; }
            updateUI(data);
        }
        function updateUI(data = {}) {
            const { name, status } = data;
            ui.mainCallButton.className = ''; ui.mainCallButton.id = 'main-call-button';
            ui.declineButton.style.display = (callState === 'INCOMING_CALL' && currentCallMedia !== 'video') ? 'flex' : 'none';
            switch (callState) {
                case 'INCOMING_CALL':
                    ui.callerName.textContent = name;
                    ui.callStatus.textContent = currentCallMedia === 'video' ? "Rozmowa wideo — odbierz na forum 📹" : "Dzwoni do Ciebie...";
                    ui.mainCallButton.innerHTML = currentCallMedia === 'video' ? "📹" : "📞";
                    ui.mainCallButton.classList.add('calling-in');
                    break;
                case 'OUTGOING_CALL': ui.callerName.textContent = name; ui.callStatus.textContent = "Dzwonienie..."; ui.mainCallButton.innerHTML = "❌"; ui.mainCallButton.classList.add('calling-out'); break;
                case 'IN_CALL': ui.callerName.textContent = name; ui.callStatus.textContent = "Trwa rozmowa"; ui.mainCallButton.innerHTML = "❌"; ui.mainCallButton.classList.add('in-call'); break;
                default: ui.callerName.textContent = "Gotowy"; ui.callStatus.textContent = status || "Wybierz kontakt, aby zadzwonić"; ui.mainCallButton.innerHTML = "📞"; ui.mainCallButton.classList.add('idle'); break;
            }
        }

        function handleMainButtonClick() {
            switch (callState) {
                case 'INCOMING_CALL':
                    if (currentCallMedia === 'video') {
                        window.location.href = `${forumBaseUrl}?action=answer_call&caller=${encodeURIComponent(currentCallPartner)}&media=video`;
                        return;
                    }
                    answerCall();
                    break;
                case 'OUTGOING_CALL':
                case 'IN_CALL':
                    endCall(true);
                    setState('IDLE', { status: "Rozmowa zakończona" });
                    break;
            }
        }

        async function answerCall() {
            stopRing();
            const caller = currentCallPartner;
            sendWs({ type: 'call_answered', payload: { caller: caller, media: 'audio' } });
            try {
                await ensurePeer(caller);
                setState('IN_CALL', { name: caller, status: 'Łączenie...' });
                ui.callStatus.textContent = "Łączenie...";
            } catch (err) {
                setState('INCOMING_CALL', { name: caller });
                ui.callStatus.textContent = "Dotknij 📞, aby odebrać (dostęp do mikrofonu)";
                startRing();
            }
        }

        function declineCall() {
            stopRing();
            if (currentCallPartner) sendWs({ type: 'call_declined', payload: { caller: currentCallPartner } });
            teardownPeer();
            setState('IDLE', { status: "Połączenie odrzucone" });
        }

        function endCall(notify) {
            stopRing();
            clearTimeout(outgoingTimer);
            if (notify && socket?.readyState === WebSocket.OPEN && currentCallPartner) {
                if (callState === 'OUTGOING_CALL') sendWs({ type: 'call_cancelled', payload: { recipient: currentCallPartner } });
                sendSignal(currentCallPartner, { type: 'hangup' });
            }
            teardownPeer();
        }

        function teardownPeer() {
            if (peerConnection) { try { peerConnection.close(); } catch (e) {} peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            pendingIce = [];
            document.querySelectorAll('audio.remote-audio').forEach(a => a.remove());
        }

        function sendWs(obj) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj)); }
        function sendSignal(recipient, signal) { sendWs({ type: 'webrtc_signal', payload: { recipient, signal } }); }

        function connectSocket() {
            socket = new WebSocket(wsUrl);
            socket.onopen = () => {
                myUsername = localStorage.getItem('forumUsername');
                if (myUsername) { socket.send(JSON.stringify({ type: 'join', payload: { username: myUsername, password: localStorage.getItem('forumPassword') || '' } })); }
                else { updateUI({ status: "Zaloguj się na forum" }); }
            };
            socket.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                switch (data.type) {
                    case 'join_success': onJoined(); break;
                    case 'join_failed': updateUI({ status: "Błąd logowania — zaloguj się na forum" }); break;
                    case 'user_update': renderContacts(data.payload.users); break;
                    case 'webrtc_signal': handleWebRTCSignal(data.payload.sender, data.payload.signal); break;
                    case 'incoming_call_online':
                        if (callState !== 'IDLE') return;
                        currentCallMedia = data.payload.media || 'audio';
                        setState('INCOMING_CALL', { name: data.payload.caller });
                        if (currentCallMedia !== 'video') startRing();
                        break;
                    case 'call_answered':
                        if (callState === 'OUTGOING_CALL') { clearTimeout(outgoingTimer); startOutgoingWebRTC(data.payload.callee); }
                        break;
                    case 'call_declined': teardownPeer(); setState('IDLE', { status: `${data.payload.callee} odrzucił(a) połączenie.` }); break;
                    case 'recipient_busy': teardownPeer(); setState('IDLE', { status: `${data.payload.recipient} jest niedostępny.` }); break;
                    case 'call_timeout': teardownPeer(); setState('IDLE', { status: `${data.payload.recipient} nie odebrał(a).` }); break;
                    case 'call_cancelled':
                        if (callState === 'INCOMING_CALL' && data.payload.caller === currentCallPartner) { stopRing(); teardownPeer(); setState('IDLE', { status: `${data.payload.caller} anulował(a) połączenie.` }); }
                        break;
                }
            };
            socket.onclose = () => { if (callState === 'IDLE') updateUI({ status: "Rozłączono — łączenie ponownie..." }); setTimeout(() => { if (!socket || socket.readyState > 1) connectSocket(); }, 3000); };
        }

        function onJoined() {
            subscribePush();
            const urlParams = new URLSearchParams(window.location.search);
            const caller = urlParams.get('caller');
            if (!caller) return;
            currentCallMedia = urlParams.get('media') || 'audio';
            window.history.replaceState({}, document.title, window.location.pathname);
            if (urlParams.get('action') === 'decline') {
                currentCallPartner = caller;
                sendWs({ type: 'call_declined', payload: { caller: caller } });
                setState('IDLE', { status: "Połączenie odrzucone" });
                return;
            }
            setState('INCOMING_CALL', { name: caller });
            if (urlParams.get('answer') === '1' && currentCallMedia !== 'video') { answerCall(); }
            else if (currentCallMedia !== 'video') { startRing(); }
        }

        async function subscribePush() {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
            try {
                const registration = await navigator.serviceWorker.ready;
                let sub = await registration.pushManager.getSubscription();
                if (!sub) {
                    const key = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
                    sub = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
                }
                sendWs({ type: 'register_push_subscription', payload: { subscription: sub } });
            } catch (e) { /* brak zgody na powiadomienia — aplikacja działa, tylko bez push */ }
        }
        function urlBase64ToUint8Array(base64String) { const padding = '='.repeat((4 - base64String.length % 4) % 4); const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/'); const rawData = window.atob(base64); const outputArray = new Uint8Array(rawData.length); for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); } return outputArray; }

        function renderContacts(allUsers) {
            const me = allUsers.find(u => u.username === myUsername);
            ui.contactsList.innerHTML = '';
            if (!me || !me.relationships) return;
            const favorites = Object.keys(me.relationships).filter(u => me.relationships[u] === 'favorite');
            if (favorites.length === 0) { ui.contactsList.innerHTML = '<li class="contact-item" style="justify-content: center;">Brak ulubionych</li>'; return; }
            favorites.forEach(username => {
                const userData = allUsers.find(u => u.username === username);
                const isActive = userData && userData.status === 'active';
                const li = document.createElement('li'); li.className = 'contact-item';
                li.innerHTML = `<span class="contact-name">${username}</span><span class="contact-status">${isActive ? '🟢 aktywny' : '⚪ nieaktywny'}</span><button class="contact-call-btn" title="Zadzwoń do ${username}">📞</button>`;
                li.querySelector('.contact-call-btn').onclick = () => {
                    ui.contactsPanel.classList.remove('visible');
                    currentCallMedia = 'audio';
                    setState('OUTGOING_CALL', { name: username });
                    sendWs({ type: 'initiate_call', payload: { recipient: username, media: 'audio' } });
                    clearTimeout(outgoingTimer);
                    outgoingTimer = setTimeout(() => { if (callState === 'OUTGOING_CALL') { teardownPeer(); setState('IDLE', { status: `${username} nie odebrał(a).` }); } }, 70000);
                };
                ui.contactsList.appendChild(li);
            });
        }

        async function ensurePeer(targetUser) {
            if (peerConnection) return peerConnection;
            if (!localStream) { localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
            peerConnection = createPeerConnection(targetUser);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            return peerConnection;
        }

        async function startOutgoingWebRTC(targetUser) {
            try {
                const pc = await ensurePeer(targetUser);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendSignal(targetUser, { type: 'offer', sdp: offer.sdp });
                setState('IN_CALL', { name: targetUser });
                ui.callStatus.textContent = "Łączenie...";
            } catch (err) { teardownPeer(); setState('IDLE', { status: "Błąd mikrofonu" }); }
        }

        function createPeerConnection(targetUser) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            pc.onicecandidate = e => { if (e.candidate) sendSignal(targetUser, { type: 'ice-candidate', candidate: e.candidate }); };
            pc.ontrack = e => {
                let audio = document.querySelector('audio.remote-audio');
                if (!audio) { audio = document.createElement('audio'); audio.className = 'remote-audio'; audio.autoplay = true; document.body.appendChild(audio); }
                audio.srcObject = e.streams[0];
                setState('IN_CALL', { name: targetUser });
            };
            pc.onconnectionstatechange = () => { if (['disconnected', 'closed', 'failed'].includes(pc.connectionState)) { if (callState === 'IN_CALL') { teardownPeer(); setState('IDLE', { status: "Połączenie zakończone." }); } } };
            return pc;
        }

        async function handleWebRTCSignal(sender, signal) {
            try {
                if (signal.type === 'offer') {
                    const pc = await ensurePeer(sender);
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: signal.sdp }));
                    for (const c of pendingIce) { try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
                    pendingIce = [];
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(sender, { type: 'answer', sdp: answer.sdp });
                } else if (signal.type === 'answer') {
                    if (peerConnection && peerConnection.signalingState === 'have-local-offer') {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: signal.sdp }));
                        for (const c of pendingIce) { try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
                        pendingIce = [];
                    }
                } else if (signal.type === 'ice-candidate') {
                    if (peerConnection && peerConnection.remoteDescription) { try { await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate)); } catch (e) {} }
                    else { pendingIce.push(signal.candidate); }
                } else if (signal.type === 'hangup') {
                    stopRing(); teardownPeer();
                    if (callState !== 'IDLE') setState('IDLE', { status: "Rozmówca zakończył połączenie." });
                }
            } catch (err) { console.error("Błąd WebRTC Signal:", err); }
        }
    </script>
</body>
</html>
