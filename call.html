<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#7289da">
    <style>
        :root {
            --bg-color: #23272a; --header-color: #1e2124; --text-color: #fff;
            --accent-color: #7289da; --green: #43b581; --red: #dc3545; --grey: #99aab5;
        }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: var(--header-color); flex-shrink: 0; z-index: 5; }

        #my-name { flex: 1; text-align: center; font-weight: bold; font-size: 1.05rem; color: var(--text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }

        #remote-tile { position: absolute; display: none; background: #000; overflow: hidden; z-index: 1; border-radius: 8px; border: 1px solid #ffffff22; box-shadow: 0 4px 14px rgba(0,0,0,0.45); touch-action: none; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; background: #000; display: none; touch-action: none; }
        #local-tile { position: absolute; right: 12px; top: 56px; width: 26vw; max-width: 140px; aspect-ratio: 3/4; border-radius: 12px; border: 2px solid #ffffff33; background: #000; display: none; z-index: 3; touch-action: none; overflow: hidden; }
        #local-video { width: 100%; height: 100%; object-fit: cover; display: block; }
        #local-btns { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; z-index: 4; }
        #local-btns button { width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; font-size: 0.85rem; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; }
        #warstwa-gestow { position: absolute; inset: 0; display: none; z-index: 2; touch-action: none; }
        #caller-info { min-height: 60px; z-index: 2; }
        #caller-info.on-video { position: absolute; top: 14px; left: 0; right: 0; min-height: 0; text-shadow: 0 1px 4px #000; pointer-events: none; z-index: 5; }
        #caller-name { font-size: 2rem; font-weight: bold; word-break: break-word; }

        #decline-button { width: 72px; height: 72px; border-radius: 50%; border: none; font-size: 2rem; cursor: pointer; background-color: var(--red); display: none; justify-content: center; align-items: center; }
        .sluch-rozlacz { position: relative; display: inline-block; }

        .sluch-rozlacz::after { content: ''; position: absolute; left: -14%; right: -14%; top: 50%; height: .14em; min-height: 4px; background: #fff; border-radius: 2px; transform: translateY(-50%) rotate(45deg); box-shadow: 0 0 0 .02em rgba(0,0,0,.35); }
        .mini-btn { width: 56px; height: 56px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; background-color: #ffffff26; color: #fff; display: none; justify-content: center; align-items: center; }
        .mini-btn.off { background-color: var(--red); }

        .zaproszenie-karta .zap-przyciski { display: flex; gap: 6px; margin-top: 6px; }

        .zaproszenie-karta .zap-tak { background-color: var(--green); }

        #friends-header { position: relative; display: flex; align-items: center; gap: 8px; text-align: left; }
        #friends-collapse { background: #ffffff1a; border: 1px solid #ffffff33; border-radius: 6px; color: var(--text-color); font-size: 1.05rem; font-weight: bold; line-height: 1.2; cursor: pointer; padding: 2px 9px; flex-shrink: 0; }

        #account-menu.visible { display: flex; }
        #account-menu button { background: none; border: none; color: var(--text-color); text-align: left; padding: 14px 16px; font-size: 1rem; cursor: pointer; }
        #account-menu button:hover { background-color: #ffffff14; }
        #account-menu button.danger { color: #ff8a8a; }
        #login-panel { position: fixed; inset: 0; background-color: var(--bg-color); display: none; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 24px; z-index: 300; text-align: center; }
        #login-panel.visible { display: flex; }
        #login-panel h1 { font-size: 1.6rem; margin: 0; }
        #login-panel p { color: var(--grey); margin: 0; max-width: 340px; }
        #login-panel input { width: 100%; max-width: 320px; padding: 13px 16px; border: none; border-radius: 22px; background-color: #40444b; color: #fff; font-size: 1rem; }
        #login-btn { width: 100%; max-width: 320px; padding: 13px; border: none; border-radius: 22px; background-color: var(--accent-color); color: #fff; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
        #login-error { color: #ff8a8a; min-height: 1.2em; font-size: 0.95rem; }
        #chat-panel { position: fixed; inset: 0; background-color: var(--bg-color); display: none; flex-direction: column; z-index: 200; }
        #chat-panel.visible { display: flex; }
        #chat-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background-color: var(--header-color); }
        #chat-back { background: none; border: none; color: var(--text-color); font-size: 1.6rem; cursor: pointer; }
        #chat-title { flex-grow: 1; font-weight: bold; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-call-btn { background: none; border: none; font-size: 1.05rem; cursor: pointer; padding: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        #chat-call-audio { margin-left: auto; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { max-width: 78%; padding: 9px 12px; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap; }
        .bubble.mine { align-self: flex-end; background-color: var(--accent-color); border-bottom-right-radius: 4px; }
        .bubble.theirs { align-self: flex-start; background-color: #36393f; border-bottom-left-radius: 4px; }

        const koniecDotyku = e => { for (const t of e.changedTouches) dotyki.delete(t.identifier); if (dotyki.size < 2) pinchDotyk = null; if (dotyki.size === 0 && tapStart) { const t = e.changedTouches[0]; if (t && Math.hypot(t.clientX - tapStart.x, t.clientY - tapStart.y) < 12 && Date.now() - tapStart.czas < 300) { const teraz = Date.now(); if (teraz - ostatniTap < 350) { resetZoom(); ostatniTap = 0; } else ostatniTap = teraz; } tapStart = null; } };
        ui.warstwaGestow.addEventListener('touchend', koniecDotyku);
        ui.warstwaGestow.addEventListener('touchcancel', koniecDotyku);

        // Wlasny podglad (kafelek jak na forum): przyciski ➕/➖ w prawym gornym rogu
        // okienka zmieniaja jego rozmiar (0.5x–3x), a przeciaganie przesuwa okienko.
        function zastosujPip() {
            const W = ui.callArea.clientWidth || 400;
            const baza = Math.min(140, Math.round(W * 0.26));
            ui.localTile.style.maxWidth = 'none';
            ui.localTile.style.height = '';
            ui.localTile.style.width = Math.round(baza * pipSkala) + 'px';
        }
        ui.localZoomIn.addEventListener('click', () => { pipSkala = Math.min(6, pipSkala * 1.25); zastosujPip(); });
        ui.localZoomOut.addEventListener('click', () => { pipSkala = Math.max(0.5, pipSkala / 1.25); zastosujPip(); });
        let pipDrag = null;
        let pipWskaznik = false;
        ui.localTile.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; pipWskaznik = true; try { ui.localTile.setPointerCapture(e.pointerId); } catch (err) {} const r = ui.localTile.getBoundingClientRect(); pipDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; });
        ui.localTile.addEventListener('pointermove', e => { if (!pipDrag) return; const rodzic = ui.localTile.parentElement.getBoundingClientRect(); let l = e.clientX - rodzic.left - pipDrag.dx, t = e.clientY - rodzic.top - pipDrag.dy; l = Math.max(0, Math.min(rodzic.width - ui.localTile.clientWidth, l)); t = Math.max(0, Math.min(rodzic.height - ui.localTile.clientHeight, t)); ui.localTile.style.left = l + 'px'; ui.localTile.style.top = t + 'px'; ui.localTile.style.right = 'auto'; });
        const koniecPip = () => { pipDrag = null; pipWskaznik = false; };
        ui.localTile.addEventListener('pointerup', koniecPip);
        ui.localTile.addEventListener('pointercancel', koniecPip);
        // Zapas dla aplikacji: te same ruchy na zdarzeniach dotykowych.
        ui.localTile.addEventListener('touchstart', e => { if (pipWskaznik || e.target.closest('button')) return; const t = e.changedTouches[0]; const r = ui.localTile.getBoundingClientRect(); pipDrag = { dx: t.clientX - r.left, dy: t.clientY - r.top }; }, { passive: true });
        ui.localTile.addEventListener('touchmove', e => { if (pipWskaznik || !pipDrag) return; const t = e.changedTouches[0]; const rodzic = ui.localTile.parentElement.getBoundingClientRect(); let l = t.clientX - rodzic.left - pipDrag.dx, tt = t.clientY - rodzic.top - pipDrag.dy; l = Math.max(0, Math.min(rodzic.width - ui.localTile.clientWidth, l)); tt = Math.max(0, Math.min(rodzic.height - ui.localTile.clientHeight, tt)); ui.localTile.style.left = l + 'px'; ui.localTile.style.top = tt + 'px'; ui.localTile.style.right = 'auto'; }, { passive: true });
        ui.localTile.addEventListener('touchend', () => { if (!pipWskaznik) pipDrag = null; });
        ui.localTile.addEventListener('touchcancel', () => { if (!pipWskaznik) pipDrag = null; });

        // Odblokowanie odtwarzania: gdy przegladarka wstrzyma dzwiek/obraz rozmowcy
        // (polityka autoplay), pierwsze dotkniecie ekranu wznawia odtwarzanie.
        document.addEventListener('pointerdown', () => {
            const a = document.querySelector('audio.remote-audio');
            if (a && a.paused) a.play().catch(() => {});
            if (ui.remoteVideo.srcObject && ui.remoteVideo.paused) ui.remoteVideo.play().catch(() => {});
        });
    </script>
</body>
</html>
