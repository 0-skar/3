<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kontakty</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#7289da">
    <style>
        :root {
            --bg-color: #23272a; --header-color: #1e2124; --text-color: #fff;
            --accent-color: #7289da; --green: #43b581; --red: #dc3545; --grey: #99aab5;
        }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background-color: var(--header-color); flex-shrink: 0; z-index: 5; }
        header a, header button { color: var(--grey); text-decoration: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; padding: 5px; }
        #my-name { flex: 1; text-align: center; font-weight: bold; font-size: 1.05rem; color: var(--text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
        #layout { display: flex; flex: 1; min-height: 0; }
        #call-area { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 16px; position: relative; }
        #remote-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; display: none; touch-action: none; transform-origin: center center; }
        #local-video { position: absolute; right: 12px; top: 12px; width: 26vw; max-width: 140px; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; border: 2px solid #ffffff33; background: #000; display: none; z-index: 3; touch-action: none; }
        #caller-info { min-height: 60px; z-index: 2; }
        #caller-info.on-video { position: absolute; top: 14px; left: 0; right: 0; min-height: 0; text-shadow: 0 1px 4px #000; pointer-events: none; }
        #caller-name { font-size: 2rem; font-weight: bold; word-break: break-word; }
        #caller-info.on-video #caller-name { font-size: 1.3rem; }
        #call-status { font-size: 0.95rem; color: var(--grey); margin-top: 5px; }
        #caller-info.on-video #call-status { color: #ddd; }
        #contact-circles { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 34px; z-index: 2; }
        .circles-row { display: flex; justify-content: center; }
        .circles-row.bottom { gap: 44px; }
        #contact-circles.disabled { opacity: 0.4; }
        .circle-btn { width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; color: #fff; position: relative; }
        .circle-btn .c-icon { font-size: 2.7rem; line-height: 1; }
        #circle-audio { background-color: #2f9e6e; }
        #circle-video { background-color: var(--accent-color); }
        #circle-msg { background-color: #4f545c; }
        .circle-btn.niedostepna, .chat-call-btn.niedostepna, #chat-send.niedostepna { opacity: 0.25; filter: grayscale(1); }
        .unread-badge { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px; background-color: var(--red); color: #fff; font-size: 0.8rem; font-weight: bold; text-align: center; }
        .circle-btn .unread-badge { position: absolute; top: -4px; right: -4px; }
        #call-buttons { display: none; gap: 22px; align-items: center; margin-top: 40px; z-index: 4; }
        #call-buttons.on-video { position: absolute; bottom: 22px; left: 0; right: 0; justify-content: center; margin-top: 0; }
        #main-call-button { width: 100px; height: 100px; border-radius: 50%; border: none; font-size: 3rem; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        #decline-button { width: 72px; height: 72px; border-radius: 50%; border: none; font-size: 2rem; cursor: pointer; background-color: var(--red); display: none; justify-content: center; align-items: center; }
        .mini-btn { width: 56px; height: 56px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; background-color: #ffffff26; color: #fff; display: none; justify-content: center; align-items: center; }
        .mini-btn.off { background-color: var(--red); }
        .idle { background-color: var(--accent-color); }
        .calling-out, .in-call { background-color: var(--red); }
        .calling-in { background-color: var(--green); animation: ring-pulse 1s infinite; }
        @keyframes ring-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        #friends-panel { width: 230px; flex-shrink: 0; background-color: #2c2f33; border-left: 1px solid #444; display: flex; flex-direction: column; min-height: 0; }
        #friends-header { padding: 13px; text-align: center; font-weight: bold; border-bottom: 1px solid #444; }
        #friends-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .friend-item { display: flex; align-items: center; gap: 7px; padding: 13px 12px; cursor: pointer; border-bottom: 1px solid #ffffff10; }
        .friend-item:hover { background-color: #ffffff0d; }
        .friend-item.selected { background-color: #7289da33; box-shadow: inset 3px 0 0 var(--accent-color); }
        .friend-name { flex: 1; min-width: 0; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .friend-status { font-size: 0.8rem; }
        .relationship-icon { cursor: pointer; display: inline-flex; align-items: center; color: var(--accent-color); flex-shrink: 0; }
        .relationship-icon svg { width: 1.1em; height: 1.1em; }
        .relationship-icon.blocked { color: var(--red); }
        .relationship-icon.favorite { color: #f0b90c; }
        .friend-remove { cursor: pointer; color: var(--grey, #99aab5); flex-shrink: 0; padding: 0 3px; font-size: 13px; }
        .friend-remove:hover { color: var(--red); }
        #zaproszenia { display: flex; flex-direction: column; }
        .zaproszenie-karta { background-color: #40444b; border: 1px solid var(--accent-color); border-radius: 8px; padding: 8px; margin: 6px; color: var(--text-color); font-size: 0.85rem; }
        .zaproszenie-karta .zap-przyciski { display: flex; gap: 6px; margin-top: 6px; }
        .zaproszenie-karta button { flex: 1; border: none; border-radius: 5px; padding: 5px 0; cursor: pointer; color: white; font-weight: bold; }
        .zaproszenie-karta .zap-tak { background-color: var(--green); }
        .zaproszenie-karta .zap-nie { background-color: var(--red); }
        .zap-info { background-color: #40444b; border-radius: 8px; padding: 8px; margin: 6px; color: var(--text-color); font-size: 0.85rem; }
        @media (max-width: 640px) {
            #friends-panel { width: 40%; }
            .circle-btn { width: 80px; height: 80px; }
            .circle-btn .c-icon { font-size: 2.2rem; }
            .circles-row.bottom { gap: 26px; }
            #caller-name { font-size: 1.5rem; }
            #contact-circles { gap: 10px; margin-top: 24px; }
        }
        #account-menu { position: fixed; top: 62px; right: 10px; background-color: #2c2f33; border: 1px solid #444; border-radius: 12px; display: none; flex-direction: column; min-width: 210px; z-index: 250; overflow: hidden; box-shadow: 0 8px 24px #000a; }
        #account-menu.visible { display: flex; }
        #account-menu button { background: none; border: none; color: var(--text-color); text-align: left; padding: 14px 16px; font-size: 1rem; cursor: pointer; }
        #account-menu button:hover { background-color: #ffffff14; }
        #account-menu button.danger { color: #ff8a8a; }
        #login-panel { position: fixed; inset: 0; background-color: var(--bg-color); display: none; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 24px; z-index: 300; text-align: center; }
        #login-panel.visible { display: flex; }
        #login-panel h1 { font-size: 1.6rem; margin: 0; }
        #login-panel p { color: var(--grey); margin: 0; max-width: 340px; }
        #login-panel input { width: 100%; max-width: 320px; padding: 13px 16px; border: none; border-radius: 22px; background-color: #40444b; color: #fff; font-size: 1rem; }
        #login-btn { width: 100%; max-width: 320px; padding: 13px; border: none; border-radius: 22px; background-color: var(--accent-color); color: #fff; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
        #login-error { color: #ff8a8a; min-height: 1.2em; font-size: 0.95rem; }
        #chat-panel { position: fixed; inset: 0; background-color: var(--bg-color); display: none; flex-direction: column; z-index: 200; }
        #chat-panel.visible { display: flex; }
        #chat-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background-color: var(--header-color); }
        #chat-back { background: none; border: none; color: var(--text-color); font-size: 1.6rem; cursor: pointer; }
        #chat-title { flex-grow: 1; font-weight: bold; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-call-btn { background: none; border: none; font-size: 1.6rem; cursor: pointer; padding: 4px; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
        .bubble { max-width: 78%; padding: 9px 12px; border-radius: 16px; word-wrap: break-word; white-space: pre-wrap; }
        .bubble.mine { align-self: flex-end; background-color: var(--accent-color); border-bottom-right-radius: 4px; }
        .bubble.theirs { align-self: flex-start; background-color: #36393f; border-bottom-left-radius: 4px; }
        .bubble-time { display: block; font-size: 0.7rem; opacity: 0.7; margin-top: 3px; text-align: right; }
        #chat-form { display: flex; gap: 8px; padding: 10px; background-color: var(--header-color); }
        #chat-input { flex-grow: 1; min-width: 0; padding: 11px 14px; border: none; border-radius: 20px; background-color: #40444b; color: #fff; font-size: 1rem; }
        #chat-send { border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; background-color: var(--accent-color); color: #fff; cursor: pointer; flex-shrink: 0; }
        #chat-attach { border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; background: none; color: var(--text-color); cursor: pointer; flex-shrink: 0; }
        #chat-attach:disabled { opacity: 0.5; cursor: default; }
        #chat-emoji { border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 1.2rem; background: none; color: var(--text-color); cursor: pointer; flex-shrink: 0; }
        #emoji-panel { display: none; flex-wrap: wrap; gap: 2px; padding: 8px 10px; background-color: var(--header-color); }
        #emoji-panel.visible { display: flex; }
        .emoji-btn { border: none; background: none; font-size: 1.35rem; width: 40px; height: 40px; cursor: pointer; border-radius: 8px; }
        .emoji-btn:hover { background-color: #40444b; }
        .bubble-file { color: inherit; font-weight: 600; text-decoration: underline; word-break: break-all; }
        .bubble-img { display: block; max-width: 100%; border-radius: 10px; margin-top: 6px; }
        .bubble video, .bubble audio { display: block; max-width: 100%; margin-top: 6px; }
    </style>
</head>
<body>
    <header>
        <a id="forum-link" href="https://0-skar.github.io/3/" title="Przejdź do forum">⌂</a>
        <span id="my-name" title="Zalogowano jako"></span>
        <button id="close-button" title="Zakończ / Idź do Forum">❌</button>
    </header>
    <div id="layout">
        <main id="call-area">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div id="caller-info">
                <div id="caller-name">Kontakty</div>
                <div id="call-status">Kliknij znajomego z listy, potem wybierz sposób kontaktu</div>
            </div>
            <div id="contact-circles" class="disabled">
                <div class="circles-row top">
                    <button class="circle-btn" id="circle-video" title="Rozmowa wideo"><span class="c-icon">📹</span></button>
                </div>
                <div class="circles-row bottom">
                    <button class="circle-btn" id="circle-audio" title="Połączenie głosowe"><span class="c-icon">📞</span></button>
                    <button class="circle-btn" id="circle-msg" title="Wiadomość tekstowa"><span class="c-icon">💬</span></button>
                </div>
            </div>
            <div id="call-buttons">
                <button id="decline-button" title="Odrzuć połączenie">📵</button>
                <button id="main-call-button" class="idle">📞</button>
            </div>
        </main>
        <aside id="friends-panel">
            <div id="friends-header">⭐ Znajomi</div>
            <div id="zaproszenia"></div>
            <ul id="friends-list"></ul>
        </aside>
    </div>
    <div id="account-menu">
        <button id="am-forum">⌂ Przejdź na forum</button>
        <button id="am-stop" style="display:none;">⏸ Stop</button>
        <button id="am-zamknij" style="display:none;">Zamknij</button>
        <button id="am-logout">Wyloguj</button>
        <button id="am-delete" class="danger">Usuń konto</button>
        <button id="am-cancel">Anuluj</button>
    </div>
    <div id="login-panel">
        <h1>📞 Kontakty</h1>
        <p>Zaloguj się swoim kontem z forum, aby dzwonić i pisać do znajomych.</p>
        <input id="login-username" type="text" placeholder="Nazwa użytkownika" autocomplete="username">
        <input id="login-password" type="password" placeholder="Hasło" autocomplete="current-password">
        <div id="login-error"></div>
        <button id="login-btn">Zaloguj</button>
    </div>
    <div id="chat-panel">
        <div id="chat-header">
            <button id="chat-back" title="Wróć">⬅️</button>
            <span id="chat-title">Czat</span>
            <button id="chat-call-audio" class="chat-call-btn" title="Zadzwoń (słuchawka)">📞</button>
            <button id="chat-call-video" class="chat-call-btn" title="Zadzwoń (kamerka)">📹</button>
        </div>
        <div id="chat-messages"></div>
        <div id="emoji-panel"></div>
        <form id="chat-form">
            <button id="chat-attach" type="button" title="Dołącz plik">📎</button>
            <button id="chat-emoji" type="button" title="Emotikony">😀</button>
            <input id="chat-file" type="file" style="display: none;">
            <input id="chat-input" type="text" placeholder="Napisz wiadomość..." autocomplete="off">
            <button id="chat-send" type="submit" title="Wyślij">➤</button>
        </form>
    </div>
    <script>
        // CALL_V18 — Kontakty: + dolaczanie plikow w czacie (ten sam protokol co forum: POST /upload + file_message); baza CALL_V17: wiele sesji naraz (aktywny rownoczesnie na forum i w Kontaktach); sygnaly WebRTC ignorowane poza rozmowa; kamerka z v15.1, menu konta z v15.
        const hfSpaceUrl = "eosforus-chat.hf.space"; const kodToken = localStorage.getItem('forumKodToken') || ''; const wsUrl = kodToken ? `wss://${hfSpaceUrl}/ws/?kod_token=${encodeURIComponent(kodToken)}` : `wss://${hfSpaceUrl}/ws/`;
        const VAPID_PUBLIC_KEY = "BD8O0XhtyebRHHOUgMtsdkNl1j6C_ugAmEPGnXEiy-SuDK6JJIYgrdKXquvk3gmYuujmmft7WQMnTZlibryenyQ=";
        const forumBaseUrl = "https://0-skar.github.io/3/";
        let socket, myUsername, peerConnection, localStream, currentCallPartner; let callState = 'IDLE';
        let ringtone = null, pendingIce = [], outgoingTimer = null, currentCallMedia = 'audio';
        let callClockTimer = null, callStartedAt = null;
        let diagTimer = null, diagTimer2 = null, diagTekst = '';
        let openChatUser = null, unreadCounts = {}, lastUsers = [], selectedFriend = null;

        const ui = { forumLink: document.getElementById('forum-link'), closeButton: document.getElementById('close-button'), callerName: document.getElementById('caller-name'), callStatus: document.getElementById('call-status'), callerInfo: document.getElementById('caller-info'), callButtons: document.getElementById('call-buttons'), circles: document.getElementById('contact-circles'), circleAudio: document.getElementById('circle-audio'), circleVideo: document.getElementById('circle-video'), circleMsg: document.getElementById('circle-msg'), mainCallButton: document.getElementById('main-call-button'), declineButton: document.getElementById('decline-button'), remoteVideo: document.getElementById('remote-video'), localVideo: document.getElementById('local-video'), friendsList: document.getElementById('friends-list'), chatPanel: document.getElementById('chat-panel'), chatTitle: document.getElementById('chat-title'), chatMessages: document.getElementById('chat-messages'), chatForm: document.getElementById('chat-form'), chatInput: document.getElementById('chat-input'), chatAttach: document.getElementById('chat-attach'), chatEmoji: document.getElementById('chat-emoji'), emojiPanel: document.getElementById('emoji-panel'), chatFile: document.getElementById('chat-file'), chatBack: document.getElementById('chat-back'), chatCallAudio: document.getElementById('chat-call-audio'), chatCallVideo: document.getElementById('chat-call-video'), myName: document.getElementById('my-name'), accountMenu: document.getElementById('account-menu'), amForum: document.getElementById('am-forum'), amStop: document.getElementById('am-stop'), amZamknij: document.getElementById('am-zamknij'), amLogout: document.getElementById('am-logout'), amDelete: document.getElementById('am-delete'), amCancel: document.getElementById('am-cancel'), loginPanel: document.getElementById('login-panel'), loginUsername: document.getElementById('login-username'), loginPassword: document.getElementById('login-password'), loginBtn: document.getElementById('login-btn'), loginError: document.getElementById('login-error'), };

        document.addEventListener('DOMContentLoaded', initializeApp);

        function initializeApp() {
            setupEventListeners();
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('service-worker.js').catch(e => console.error('SW error', e)); }
            connectSocket();
        }

        // Opcje aplikacji (Android) w menu konta: widoczne tylko, gdy strona
        // dziala wewnatrz aplikacji (most AndroidChat); Stop <-> Start wg stanu uslugi.
        function odswiezOpcjeAplikacji() {
            const wAplikacji = typeof window.AndroidChat !== 'undefined';
            ui.amStop.style.display = wAplikacji ? '' : 'none';
            ui.amZamknij.style.display = wAplikacji ? '' : 'none';
            if (wAplikacji) { ui.amStop.textContent = window.AndroidChat.czyDziala() ? '⏸ Stop' : '▶ Start'; }
        }

        function setupEventListeners() {
            ui.closeButton.addEventListener('click', () => {
                if (callState === 'INCOMING_CALL') { declineCall(); return; }
                if (callState !== 'IDLE') { endCall(true); setState('IDLE', { status: "Gotowy do nowego połączenia" }); return; }
                ui.accountMenu.classList.toggle('visible');
                odswiezOpcjeAplikacji();
            });
            ui.amCancel.addEventListener('click', () => ui.accountMenu.classList.remove('visible'));
            ui.amForum.addEventListener('click', () => { ui.accountMenu.classList.remove('visible'); window.location.href = ui.forumLink.href; });
            ui.amStop.addEventListener('click', () => { ui.accountMenu.classList.remove('visible'); if (window.AndroidChat) { if (window.AndroidChat.czyDziala()) { window.AndroidChat.stop(); } else { window.AndroidChat.start(); } } });
            ui.amZamknij.addEventListener('click', () => { ui.accountMenu.classList.remove('visible'); if (window.AndroidChat) { window.AndroidChat.zamknij(); } });
            ui.amLogout.addEventListener('click', doLogout);
            ui.amDelete.addEventListener('click', doDeleteAccount);
            document.addEventListener('click', (e) => {
                if (ui.accountMenu.classList.contains('visible') && !ui.accountMenu.contains(e.target) && e.target !== ui.closeButton) ui.accountMenu.classList.remove('visible');
            });
            // Sesja: heartbeat aktywnosci, gdy aplikacja jest otwarta na ekranie (serwer wylogowuje po 60 min ciszy).
            setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN && myUsername && document.visibilityState === 'visible') sendWs({ type: 'ping' });
            }, 240000);
            ui.mainCallButton.addEventListener('click', handleMainButtonClick);
            ui.declineButton.addEventListener('click', declineCall);
            ui.circleAudio.addEventListener('click', () => { if (selectedFriend && callState === 'IDLE') startOutgoingCall(selectedFriend, 'audio'); });
            ui.circleVideo.addEventListener('click', () => { if (selectedFriend && callState === 'IDLE') startOutgoingCall(selectedFriend, 'video'); });
            ui.circleMsg.addEventListener('click', () => { if (selectedFriend && mojStatusDo(selectedFriend) !== 'blocked') openChat(selectedFriend); });
            ui.chatBack.addEventListener('click', closeChat);
            ui.chatForm.addEventListener('submit', (e) => { e.preventDefault(); sendChatMessage(); });
            ui.chatAttach.addEventListener('click', () => ui.chatFile.click());
            ui.chatFile.addEventListener('change', () => { const f = ui.chatFile.files[0]; if (f) sendChatFile(f); else ui.chatFile.value = ''; });
            // Panel emotikon: przycisk pokazuje/chowa, klik wstawia w pole pisania.
            const EMOJI_LISTA = ['😀', '😂', '🙂', '😉', '😍', '😘', '😎', '🤔', '😮', '😢', '😭', '😠', '😈', '😺', '❤️', '💔', '👍', '👎', '👏', '🙏', '🔥', '⭐', '🎉', '✅', '❌'];
            EMOJI_LISTA.forEach(ez => { const b = document.createElement('button'); b.type = 'button'; b.className = 'emoji-btn'; b.textContent = ez; b.addEventListener('click', () => wstawEmoji(ez)); ui.emojiPanel.appendChild(b); });
            ui.chatEmoji.addEventListener('click', () => { ui.emojiPanel.classList.toggle('visible'); ui.chatInput.focus(); });
            function wstawEmoji(ez) { const inp = ui.chatInput; const s = inp.selectionStart ?? inp.value.length; const e = inp.selectionEnd ?? inp.value.length; inp.value = inp.value.slice(0, s) + ez + inp.value.slice(e); const poz = s + ez.length; inp.focus(); try { inp.setSelectionRange(poz, poz); } catch (err) {} }
            ui.chatCallAudio.addEventListener('click', () => { if (openChatUser) { const u = openChatUser; closeChat(); startOutgoingCall(u, 'audio'); } });
            ui.chatCallVideo.addEventListener('click', () => { if (openChatUser) { const u = openChatUser; closeChat(); startOutgoingCall(u, 'video'); } });
            ui.loginBtn.addEventListener('click', doLogin);
            ui.loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
            ui.loginUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') ui.loginPassword.focus(); });
        }

        // ---------- Logowanie (samodzielne, takze poza strona forum) ----------
        function showLogin(error) {
            ui.loginError.textContent = error || '';
            ui.loginPanel.classList.add('visible');
        }
        function hideLogin() { ui.loginPanel.classList.remove('visible'); }
        function doLogin() {
            const u = ui.loginUsername.value.trim();
            const pw = ui.loginPassword.value;
            if (!u || !pw) { ui.loginError.textContent = 'Podaj nazwę użytkownika i hasło.'; return; }
            localStorage.setItem('forumUsername', u);
            localStorage.setItem('forumPassword', pw);
            myUsername = u;
            ui.loginError.textContent = 'Logowanie...';
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: 'join', payload: { username: u, password: pw, device_token: localStorage.getItem('forumDeviceToken') || '' } }));
            } else {
                try { socket && socket.close(); } catch (e) {}
                connectSocket();
            }
        }

        function selectFriend(username) {

        function startClock() {

        // Diagnostyka polaczenia: po 10 s od rozpoczecia rozmowy sprawdzamy stan ICE,
        // a gdy polaczenie jest nawiazane — takze statystyki mediow (bajty w obie strony).
        // Wynik trafia do linii statusu obok zegara, zeby bylo widac, co nie dziala.
        function zaplanujDiagnostyke(pc) {
            if (!pc || pc._diagZaplanowano) return;
            pc._diagZaplanowano = true;
            diagTekst = '';
            const sprawdzStatystyki = async () => {
                if (callState !== 'IN_CALL' || peerConnection !== pc) return;
                try {
                    const stats = await pc.getStats();
                    let wych = 0, przych = 0;
                    stats.forEach(r => { if (r.type === 'outbound-rtp') wych += r.bytesSent || 0; if (r.type === 'inbound-rtp') przych += r.bytesReceived || 0; });
                    const mamTory = localStream && localStream.getTracks().some(t => t.readyState === 'live');
                    if (wych === 0 && mamTory) diagTekst = 'Twój głos i obraz nie wychodzą z urządzenia (wysłano 0 bajtów).';
                    else if (przych === 0) diagTekst = 'Od rozmówcy nic nie dociera (odebrano 0 bajtów).';
                    else {
                        const aEl = document.querySelector('audio.remote-audio');
                        if (aEl && aEl.srcObject && aEl.paused) diagTekst = 'Dźwięk dociera, ale odtwarzanie jest wstrzymane — dotknij ekranu.';
                        else if (ui.remoteVideo.srcObject && ui.remoteVideo.paused) diagTekst = 'Obraz dociera, ale odtwarzanie jest wstrzymane — dotknij ekranu.';
                    }

            };
            diagTimer = setTimeout(() => {
                diagTimer = null;
                if (callState !== 'IN_CALL' || peerConnection !== pc) return;
                if (pc.connectionState === 'connected' || pc.connectionState === 'completed') { sprawdzStatystyki(); return; }

        function fmtTime(ts) { try { return new Date(ts).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
        function fileUrl(url) { return url && url.startsWith('http') ? url : `https://${hfSpaceUrl}${url || ''}`; }
        // Emotikony tekstowe -> emoji, ta sama lista co na forum
        // (tam dziala na tekscie po escapowaniu HTML, tu na surowym,

        function emotikony(txt) {
            const zamiany = [
                [/<3/g, '❤️'], [/<\/3/g, '💔'],
                [/>:\(/g, '😠'], [/>:\)/g, '😈'],
                [/:\)/g, '🙂'], [/:\(/g, '🙁'], [/:D/gi, '😀'],
                [/;\)/g, '😉'], [/:P/gi, '😛'], [/:o/gi, '😮'],
                [/:\|/g, '😐'], [/:'\(/g, '😢'], [/:'\)/g, '😂'],
                [/xd/gi, '😆'], [/;P/gi, '😜'], [/:3/g, '😺'],
                [/:\*/g, '😘'],
                [/\^_\^/g, '😊'], [/-_-/g, '😑'], [/o_o/gi, '😳'],
                [/O_O/g, '😲'], [/\^o\^/g, '😄'], [/T_T/g, '😭'],
                [/;_;/g, '😭'], [/\(y\)/gi, '👍'], [/\(n\)/gi, '👎'],

            let wynik = txt || '';

        function addBubble(msg, mine) {

        function sendWs(obj) { if (socket?.readyState === WebSocket.OPEN) socket.send(JSON.stringify(obj)); }

        function connectSocket() {
            socket = new WebSocket(wsUrl);
            socket.onopen = () => {
                myUsername = localStorage.getItem('forumUsername');
                if (myUsername) ui.myName.textContent = `👤 ${myUsername}`;
                if (myUsername) { socket.send(JSON.stringify({ type: 'join', payload: { username: myUsername, password: localStorage.getItem('forumPassword') || '', device_token: localStorage.getItem('forumDeviceToken') || '' } })); }

            };

                const data = JSON.parse(event.data);
                switch (data.type) {
                    case 'join_success': hideLogin(); ui.forumLink.href = forumHref(); ui.myName.textContent = myUsername ? `👤 ${myUsername}` : ''; if (!localStorage.getItem('forumDeviceToken')) sendWs({ type: 'issue_device_token' }); onJoined(); break;

                    case 'join_failed': showLogin('Błędna nazwa użytkownika lub hasło.'); break;
                    case 'user_update': lastUsers = data.payload.users; renderFriends(lastUsers); break;
                    case 'initial_data': {
                        unreadCounts = {};
                        const pc = data.payload.privateChats || {};
                        Object.keys(pc).forEach(partner => { unreadCounts[partner] = (pc[partner] || []).filter(m => m.sender === partner && !m.read).length; });
                        renderFriends(lastUsers);
                        if (callState === 'IDLE') updateUI({});
                        break;
                    }
                    case 'private_history': renderHistory(data.payload.partner, data.payload.history); break;
                    case 'private_message': {
                        const m = data.payload;
                        if (m.sender === myUsername) { if (m.recipient === openChatUser) addBubble(m, true); }
                        else if (m.sender === openChatUser) { addBubble(m, false); }
                        else { unreadCounts[m.sender] = (unreadCounts[m.sender] || 0) + 1; renderFriends(lastUsers); if (callState === 'IDLE') updateUI({}); }
                        break;
                    }
                    case 'private_message_sent': {
                        const m = data.payload;
                        if (m.recipient === openChatUser) addBubble(m, true);
                        break;
                    }
                    case 'private_file_message': {
                        const m = data.payload;
                        if (m.sender === myUsername) break;
                        if (m.sender === openChatUser) { addBubble(m, false); }
                        else { unreadCounts[m.sender] = (unreadCounts[m.sender] || 0) + 1; renderFriends(lastUsers); if (callState === 'IDLE') updateUI({}); }
                        break;
                    }
                    case 'webrtc_signal': handleWebRTCSignal(data.payload.sender, data.payload.signal); break;
                    case 'friend_request': pokazZaproszenie(data.payload.from); break;
                    case 'friend_request_accepted': infoZaproszenie(data.payload.by + ' przyjął Twoje zaproszenie — jesteście znajomymi \u{1F514}.'); break;
                    case 'friend_request_declined': infoZaproszenie(data.payload.by + ' odrzucił Twoje zaproszenie do znajomych.'); break;
                    case 'friend_request_cancelled': ukryjZaproszenie(data.payload.from); break;
                    case 'incoming_call_online':

                        setState('INCOMING_CALL', { name: data.payload.caller });

                    case 'recipient_busy': teardownPeer(); setState('IDLE', { status: `${data.payload.recipient} jest niedostępny.` }); break;
                    case 'call_timeout': teardownPeer(); setState('IDLE', { status: `${data.payload.recipient} nie odebrał(a).` }); break;
                    case 'call_cancelled':
                        if (callState === 'INCOMING_CALL' && data.payload.caller === currentCallPartner) { stopRing(); teardownPeer(); setState('IDLE', { status: `${data.payload.caller} anulował(a) połączenie.` }); }
                        break;
                }
            };
            socket.onclose = () => { if (callState === 'IDLE') updateUI({ status: "Rozłączono — łączenie ponownie..." }); setTimeout(() => { if (!socket || socket.readyState > 1) connectSocket(); }, 3000); };
        }

        function onJoined() {

        async function subscribePush() {

                sendWs({ type: 'register_push_subscription', payload: { subscription: sub } });
            } catch (e) { /* brak zgody na powiadomienia — aplikacja działa, tylko bez push */ }
        }
        function urlBase64ToUint8Array(base64String) { const padding = '='.repeat((4 - base64String.length % 4) % 4); const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/'); const rawData = window.atob(base64); const outputArray = new Uint8Array(rawData.length); for (let i = 0; i < rawData.length; ++i) { outputArray[i] = rawData.charCodeAt(i); } return outputArray; }

        const THUMB_UP_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1.91l-.01-.01L23 10z"></path></svg>`;
        const THUMB_DOWN_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14-.73v1.91l.01.01L1 14c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17-.79-.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"></path></svg>`;
        const BELL_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg>`;
        function ikonaRelacji(status) {
            if (status === 'favorite') return { svg: BELL_SVG, title: 'Powiadomienia włączone (Ulubiony)', klasa: 'favorite' };
            if (status === 'blocked') return { svg: THUMB_DOWN_SVG, title: 'Zablokowany', klasa: 'blocked' };
            return { svg: THUMB_UP_SVG, title: 'Oznacz jako ulubionego (włącz powiadomienia)', klasa: '' };
        }
        function cyklRelacji(username) {
            const me = (lastUsers || []).find(u => u.username === myUsername);
            if (!me || !me.relationships) return;
            const obecny = me.relationships[username] || 'neutral';
            const nastepny = obecny === 'neutral' ? 'favorite' : (obecny === 'favorite' ? 'blocked' : 'neutral');
            me.relationships[username] = nastepny;
            sendWs({ type: 'update_relationship', payload: { partner: username, status: nastepny } });
            renderFriends(lastUsers);
        }

        function mojStatusDo(username) {
            const me = (lastUsers || []).find(u => u.username === myUsername);
            if (!me || !me.relationships || !username) return 'neutral';
            return me.relationships[username] || 'neutral';
        }
        function odswiezDostepnosc() {
            const stWybrany = mojStatusDo(selectedFriend);
            ui.circleVideo.classList.toggle('niedostepna', stWybrany !== 'favorite');
            ui.circleAudio.classList.toggle('niedostepna', stWybrany !== 'favorite');
            ui.circleMsg.classList.toggle('niedostepna', stWybrany === 'blocked');
            const stCzat = mojStatusDo(openChatUser);
            ui.chatCallVideo.classList.toggle('niedostepna', stCzat !== 'favorite');
            ui.chatCallAudio.classList.toggle('niedostepna', stCzat !== 'favorite');
            const blokada = stCzat === 'blocked';
            ui.chatInput.disabled = blokada;
            ui.chatAttach.disabled = blokada;
            ui.chatEmoji.disabled = blokada;
            ui.chatInput.placeholder = blokada ? 'Użytkownik zablokowany' : 'Napisz wiadomość...';
            const sendBtn = document.getElementById('chat-send');
            if (sendBtn) { sendBtn.disabled = blokada; sendBtn.classList.toggle('niedostepna', blokada); }
        }

        function pokazZaproszenie(od) { if (document.getElementById('zaproszenie-' + od)) return; const kontener = document.getElementById('zaproszenia'); if (!kontener) return; const karta = document.createElement('div'); karta.className = 'zaproszenie-karta'; karta.id = 'zaproszenie-' + od; const tekst = document.createElement('div'); tekst.textContent = '\u{1F514} ' + od + ' chce dodać Cię do znajomych.'; const przyciski = document.createElement('div'); przyciski.className = 'zap-przyciski'; const tak = document.createElement('button'); tak.className = 'zap-tak'; tak.textContent = 'Przyjmij'; tak.onclick = () => { odpowiedzZaproszenie(od, true); }; const nie = document.createElement('button'); nie.className = 'zap-nie'; nie.textContent = 'Odrzuć'; nie.onclick = () => { odpowiedzZaproszenie(od, false); }; przyciski.appendChild(tak); przyciski.appendChild(nie); karta.appendChild(tekst); karta.appendChild(przyciski); kontener.appendChild(karta); }
        function odpowiedzZaproszenie(od, przyjete) { sendWs({ type: 'friend_request_response', payload: { to: od, accepted: przyjete } }); ukryjZaproszenie(od); if (przyjete) przywrocKarteZnajomego(od); }
        function ukryjZaproszenie(od) { const karta = document.getElementById('zaproszenie-' + od); if (karta) karta.remove(); }
        function infoZaproszenie(tekst) { const kontener = document.getElementById('zaproszenia'); if (!kontener) return; const d = document.createElement('div'); d.className = 'zap-info'; d.textContent = tekst; kontener.appendChild(d); setTimeout(() => { d.remove(); }, 6000); }

        function pobierzUsunietych() { try { return new Set(JSON.parse(localStorage.getItem('usunieciZnajomi_' + myUsername) || '[]')); } catch (e) { return new Set(); } }
        function zapiszUsunietych(zbior) { try { localStorage.setItem('usunieciZnajomi_' + myUsername, JSON.stringify([...zbior])); } catch (e) { } }
        function usunKarteZnajomego(username) { const zbior = pobierzUsunietych(); zbior.add(username); zapiszUsunietych(zbior); renderFriends(lastUsers); }
        function przywrocKarteZnajomego(username) { const zbior = pobierzUsunietych(); if (zbior.delete(username)) zapiszUsunietych(zbior); }

        function renderFriends(allUsers) {
            const me = (allUsers || []).find(u => u.username === myUsername);
            ui.friendsList.innerHTML = '';
            if (!me || !me.relationships) { ui.friendsList.innerHTML = '<li class="friend-item" style="justify-content:center;">Łączenie...</li>'; return; }
            const usunieci = pobierzUsunietych();
            const widoczni = Object.keys(me.relationships).filter(u => !usunieci.has(u));
            const favorites = widoczni.filter(u => me.relationships[u] === 'favorite');
            const neutralni = widoczni.filter(u => me.relationships[u] !== 'favorite' && me.relationships[u] !== 'blocked');
            const blocked = widoczni.filter(u => me.relationships[u] === 'blocked');
            const kontakty = favorites.concat(neutralni, blocked);
            if (kontakty.length === 0) { ui.friendsList.innerHTML = '<li class="friend-item" style="justify-content:center;">Brak znajomych</li>'; return; }
            kontakty.forEach(username => {
                const userData = allUsers.find(u => u.username === username);
                const isActive = userData && userData.status === 'active';
                const unread = unreadCounts[username] || 0;
                const ikona = ikonaRelacji(me.relationships[username]);
                const li = document.createElement('li');
                li.className = 'friend-item' + (username === selectedFriend ? ' selected' : '');
                li.innerHTML = `<span class="relationship-icon ${ikona.klasa}" data-partner="${username}" title="${ikona.title}">${ikona.svg}</span><span class="friend-status">${isActive ? '🟢' : '⚪'}</span><span class="friend-name">${username}</span>${unread ? `<span class="unread-badge">${unread}</span>` : ''}<span class="friend-remove" data-partner="${username}" title="Usuń kartę znajomego">✕</span>`;
                li.onclick = () => selectFriend(username);
                const ikonaEl = li.querySelector('.relationship-icon');
                ikonaEl.onclick = (e) => { e.stopPropagation(); cyklRelacji(username); };
                const usunEl = li.querySelector('.friend-remove');
                usunEl.onclick = (e) => { e.stopPropagation(); usunKarteZnajomego(username); };
                ui.friendsList.appendChild(li);
            });
            odswiezDostepnosc();
        }

        function startOutgoingCall(username, media) {
            if (mojStatusDo(username) !== 'favorite') { ui.callStatus.textContent = mojStatusDo(username) === 'blocked' ? 'Ten użytkownik jest zablokowany.' : 'Z tym użytkownikiem możesz tylko pisać wiadomości.'; return; }
            if (media === 'video') { ensureMedia(true).then(() => { const o = opisMediow('video'); if (o) ui.callStatus.textContent = o; }).catch(() => { ui.callStatus.textContent = opisMediow('video') || "Brak dostępu do mikrofonu/kamery."; }); }
            currentCallMedia = media;
            setState('OUTGOING_CALL', { name: username });
            sendWs({ type: 'initiate_call', payload: { recipient: username, media } });
            clearTimeout(outgoingTimer);
            outgoingTimer = setTimeout(() => { if (callState === 'OUTGOING_CALL') { teardownPeer(); setState('IDLE', { status: `${username} nie odebrał(a).` }); } }, 70000);
        }

        let mediaChain = Promise.resolve();
        let bladMediow = { audio: '', video: '' };
        function opisMediow(media) {
            const braki = [];
            if (!localStream || !localStream.getAudioTracks().length) braki.push('mikrofon' + (bladMediow.audio ? ' [' + bladMediow.audio + ']' : ''));
            if (media === 'video' && (!localStream || !localStream.getVideoTracks().length)) braki.push('kamera' + (bladMediow.video ? ' [' + bladMediow.video + ']' : ''));
            return braki.length ? ('Niedostępne: ' + braki.join(' i ') + ' — rozmowa ograniczona.') : '';
        }
        let mediaGen = 0;
        function ensureMedia(withVideo) {
            const run = mediaChain.then(() => acquireMediaNow(withVideo));
            mediaChain = run.catch(() => {});
            return run;
        }
        async function acquireMediaNow(withVideo) {
            const gen = mediaGen;
            if (!localStream) {
                const tory = [];
                try {
                    const a = await navigator.mediaDevices.getUserMedia({ audio: true });
                    a.getAudioTracks().forEach(t => tory.push(t));
                    bladMediow.audio = '';
                } catch (e) { bladMediow.audio = (e && e.name) || 'blad'; }
                if (withVideo) {
                    try {
                        const v = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
                        v.getVideoTracks().forEach(t => tory.push(t));
                        bladMediow.video = '';
                    } catch (e) { bladMediow.video = (e && e.name) || 'blad'; }
                }
                if (!tory.length) throw new Error(bladMediow.audio || bladMediow.video || 'brak mediow');
                if (gen !== mediaGen) { tory.forEach(t => t.stop()); return localStream; }
                localStream = new MediaStream(tory);
            } else if (withVideo && !localStream.getVideoTracks().length) {
                try {
                    const vs = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
                    if (gen !== mediaGen) { vs.getTracks().forEach(t => t.stop()); return localStream; }
                    vs.getVideoTracks().forEach(t => localStream.addTrack(t));
                    bladMediow.video = '';
                } catch (e) { bladMediow.video = (e && e.name) || 'blad'; }
            }
            ui.localVideo.srcObject = localStream;
            if (withVideo && localStream.getVideoTracks().length) {
                ui.localVideo.style.display = 'block';
                try { await ui.localVideo.play(); } catch (e) {}
                updateUI({});
            }
            return localStream;
        }

        async function ensurePeer(targetUser, withVideo) {
            if (peerConnection) return peerConnection;
            try { await ensureMedia(withVideo); } catch (e) { /* brak mediow: polaczenie tylko do sluchania */ }
            peerConnection = createPeerConnection(targetUser);
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            } else {
                peerConnection.addTransceiver('audio', { direction: 'recvonly' });
                if (withVideo) peerConnection.addTransceiver('video', { direction: 'recvonly' });
            }
            return peerConnection;
        }

        async function startOutgoingWebRTC(targetUser) {
            try {
                const pc = await ensurePeer(targetUser, currentCallMedia === 'video');
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sendSignal(targetUser, { type: 'offer', sdp: offer.sdp });
                setState('IN_CALL', { name: targetUser });
                ui.callStatus.textContent = opisMediow(currentCallMedia) || "Łączenie...";
            } catch (err) { teardownPeer(); setState('IDLE', { status: "Błąd mikrofonu/kamery" }); }
        }

        function createPeerConnection(targetUser) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] });
            pc.onicecandidate = e => { if (e.candidate) sendSignal(targetUser, { type: 'ice-candidate', candidate: e.candidate }); };
            pc.ontrack = e => {
                if (e.track.kind === 'video') {
                    ui.remoteVideo.srcObject = e.streams[0];
                    ui.remoteVideo.style.display = 'block';
                    resetZoom();
                    ui.remoteVideo.play().catch(() => {});
                } else {
                    let audio = document.querySelector('audio.remote-audio');
                    if (!audio) { audio = document.createElement('audio'); audio.className = 'remote-audio'; audio.autoplay = true; document.body.appendChild(audio); }
                    audio.srcObject = e.streams[0];
                    audio.play().catch(() => {});
                }
                if (callState !== 'IN_CALL') setState('IN_CALL', { name: targetUser });
                if (!callStartedAt) startClock();
                updateUI({});
            };
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected' || pc.connectionState === 'completed') { if (pc._timerRozlaczenia) { clearTimeout(pc._timerRozlaczenia); pc._timerRozlaczenia = null; } return; }
                if (pc.connectionState === 'disconnected') { if (!pc._timerRozlaczenia) { pc._timerRozlaczenia = setTimeout(() => { pc._timerRozlaczenia = null; if (callState === 'IN_CALL' && peerConnection === pc && pc.connectionState !== 'connected' && pc.connectionState !== 'completed') { teardownPeer(); setState('IDLE', { status: "Połączenie zakończone." }); } }, 6000); } return; }
                if (['closed', 'failed'].includes(pc.connectionState)) { if (callState === 'IN_CALL') { teardownPeer(); setState('IDLE', { status: "Połączenie zakończone." }); } }
            };
            return pc;
        }

        async function handleWebRTCSignal(sender, signal) {
            if (callState === 'IDLE') return; // MULTI_V17: sygnaly cudzych rozmow (np. z forum) poza rozmowa ignoruj
            try {
                if (signal.type === 'offer') {
                    const pc = await ensurePeer(sender, currentCallMedia === 'video' || !!(localStream && localStream.getVideoTracks().length));
                    await pc.setRemoteDescription(new RTCSessionDescription({ type: 'offer', sdp: signal.sdp }));
                    for (const c of pendingIce) { try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
                    pendingIce = [];
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    sendSignal(sender, { type: 'answer', sdp: answer.sdp });
                    if (callState !== 'IN_CALL') setState('IN_CALL', { name: sender });
                } else if (signal.type === 'answer') {
                    if (peerConnection && peerConnection.signalingState === 'have-local-offer') {
                        await peerConnection.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: signal.sdp }));
                        for (const c of pendingIce) { try { await peerConnection.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
                        pendingIce = [];
                    }
                } else if (signal.type === 'ice-candidate') {
                    if (peerConnection && peerConnection.remoteDescription) { try { await peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate)); } catch (e) {} }
                    else { pendingIce.push(signal.candidate); }
                } else if (signal.type === 'hangup') {
                    stopRing(); teardownPeer();
                    if (callState !== 'IDLE') setState('IDLE', { status: "Rozmówca zakończył połączenie." });
                }
            } catch (err) { console.error("Błąd WebRTC Signal:", err); }
        }

        // Powiekszanie i przesuwanie obrazu rozmowcy: szczypanie, przeciaganie jednym palcem,
        // kolko myszy; podwojne klikniecie/dotkniecie wraca do calego obrazu.
        const zoomStan = { skala: 1, x: 0, y: 0 };
        const wskazowki = new Map();
        let pinchStart = null;
        function zastosujZoom() {
            const v = ui.remoteVideo;
            if (zoomStan.skala <= 1) { zoomStan.x = 0; zoomStan.y = 0; }
            const maxX = v.clientWidth * (zoomStan.skala - 1) / 2, maxY = v.clientHeight * (zoomStan.skala - 1) / 2;
            zoomStan.x = Math.max(-maxX, Math.min(maxX, zoomStan.x));
            zoomStan.y = Math.max(-maxY, Math.min(maxY, zoomStan.y));
            v.style.transform = `translate(${zoomStan.x}px, ${zoomStan.y}px) scale(${zoomStan.skala})`;
        }
        function resetZoom() { zoomStan.skala = 1; zoomStan.x = 0; zoomStan.y = 0; if (ui.remoteVideo) ui.remoteVideo.style.transform = ''; }
        ui.remoteVideo.addEventListener('pointerdown', e => { try { ui.remoteVideo.setPointerCapture(e.pointerId); } catch (err) {} wskazowki.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (wskazowki.size === 2) { const p = [...wskazowki.values()]; pinchStart = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), skala: zoomStan.skala }; } });
        ui.remoteVideo.addEventListener('pointermove', e => { if (!wskazowki.has(e.pointerId)) return; const poprz = wskazowki.get(e.pointerId); wskazowki.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (wskazowki.size === 1) { zoomStan.x += e.clientX - poprz.x; zoomStan.y += e.clientY - poprz.y; zastosujZoom(); } else if (wskazowki.size === 2 && pinchStart && pinchStart.d > 0) { const p = [...wskazowki.values()]; const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); zoomStan.skala = Math.max(1, Math.min(4, pinchStart.skala * d / pinchStart.d)); zastosujZoom(); } });
        const koniecWskazowki = e => { wskazowki.delete(e.pointerId); if (wskazowki.size < 2) pinchStart = null; };
        ui.remoteVideo.addEventListener('pointerup', koniecWskazowki);
        ui.remoteVideo.addEventListener('pointercancel', koniecWskazowki);
        ui.remoteVideo.addEventListener('wheel', e => { e.preventDefault(); zoomStan.skala = Math.max(1, Math.min(4, zoomStan.skala * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); zastosujZoom(); }, { passive: false });
        ui.remoteVideo.addEventListener('dblclick', resetZoom);

        // Przesuwanie wlasnego podgladu (maly obrazek) w dowolne miejsce ekranu.
        let pipDrag = null;
        ui.localVideo.addEventListener('pointerdown', e => { try { ui.localVideo.setPointerCapture(e.pointerId); } catch (err) {} const r = ui.localVideo.getBoundingClientRect(); pipDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; });
        ui.localVideo.addEventListener('pointermove', e => { if (!pipDrag) return; const rodzic = ui.localVideo.parentElement.getBoundingClientRect(); let l = e.clientX - rodzic.left - pipDrag.dx, t = e.clientY - rodzic.top - pipDrag.dy; l = Math.max(0, Math.min(rodzic.width - ui.localVideo.clientWidth, l)); t = Math.max(0, Math.min(rodzic.height - ui.localVideo.clientHeight, t)); ui.localVideo.style.left = l + 'px'; ui.localVideo.style.top = t + 'px'; ui.localVideo.style.right = 'auto'; });
        const koniecPip = () => { pipDrag = null; };
        ui.localVideo.addEventListener('pointerup', koniecPip);
        ui.localVideo.addEventListener('pointercancel', koniecPip);

        // Odblokowanie odtwarzania: gdy przegladarka wstrzyma dzwiek/obraz rozmowcy
        // (polityka autoplay), pierwsze dotkniecie ekranu wznawia odtwarzanie.
        document.addEventListener('pointerdown', () => {
            const a = document.querySelector('audio.remote-audio');
            if (a && a.paused) a.play().catch(() => {});
            if (ui.remoteVideo.srcObject && ui.remoteVideo.paused) ui.remoteVideo.play().catch(() => {});
        });
    </script>
